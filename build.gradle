plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // TFC、Patchouli 与 Create 的 NeoForge 发布包均由 Modrinth Maven 提供。
    maven { url = 'https://api.modrinth.com/maven' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "maven.modrinth:terrafirmacraft:${tfc_version}"
    implementation "maven.modrinth:patchouli:${patchouli_version}"
    implementation "maven.modrinth:create:${create_version}"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
def oreMaterialManifest = file('src/main/ore_materials.json')
def fixedOreResourceRoot = file("${buildDir}/generated/resources")
def fixedOreModId = mod_id
// 固定矿物的中文显示名随构建资源一同生成，避免把内部 ID 暴露给玩家。
def fixedOreChineseNames = [
    copper: '铜', gold: '金', silver: '银', tin: '锡', bismuth: '铋', zinc: '锌',
    iron: '铁', nickel: '镍', limonite: '褐铁', magnetite: '磁铁', malachite: '孔雀石',
    tetrahedrite: '黝铜', galena: '方铅', bauxite: '铝土', chromite: '铬铁', uraninite: '沥青铀'
]
def readReferenceModel = { File jarFile, String entryName, String textureName ->
    if (!jarFile.exists()) {
        return null
    }
    def referenceZip = new java.util.zip.ZipFile(jarFile)
    try {
        def entry = referenceZip.getEntry(entryName)
        if (entry == null) {
            return null
        }
        def model = new groovy.json.JsonSlurper().parse(referenceZip.getInputStream(entry))
        // 参考模型只作为验证版模板，纹理实际由本模组命名空间提供。
        def rewrite = { value ->
            if (value instanceof String && value.startsWith('tfcorewashing:item/')) {
                return "${fixedOreModId}:item/${textureName}"
            }
            return value
        }
        model.textures?.replaceAll { key, value -> model.textures[key] = rewrite(value) }
        return model
    } finally {
        referenceZip.close()
    }
}

// 构建期只读取固定清单和已解析的 TFC JAR，不在运行时动态注册物品。
def generateFixedOreResources = tasks.register('generateFixedOreResources') {
    inputs.file oreMaterialManifest
    inputs.file file("src/main/resources/assets/${fixedOreModId}/lang/en_us.json")
    inputs.file file("src/main/resources/assets/${fixedOreModId}/lang/zh_cn.json")
    outputs.dir fixedOreResourceRoot
    notCompatibleWithConfigurationCache('任务执行时需要解析 TFC 依赖 JAR')
    // 语言文件必须随固定清单完整重建，避免增量构建残留旧的部分合并结果。
    outputs.upToDateWhen { false }
    doLast { task ->
        // 清理本任务上一次失败留下的资源，避免旧文件与源资源重复。
        project.delete(fixedOreResourceRoot)
        def materials = new groovy.json.JsonSlurper().parse(oreMaterialManifest)
        def tfcJarPath = task.project.configurations.runtimeClasspath.files
            .find { it.name.startsWith('terrafirmacraft-') && it.name.endsWith('.jar') }?.absolutePath
        if (tfcJarPath == null) {
            throw new IllegalStateException('找不到 TFC 4.2.7 JAR，无法校验固定矿物清单')
        }
        def zip = new java.util.zip.ZipFile(new File(tfcJarPath))
        def referenceJar = file('C:/Users/JuziD/apps/minecraft/.minecraft/versions/EndlessFirma/mods/[tfc]tfc-ore-washing-1.20.1-forge-1.0.6.jar')
        try {
            def langDir = new File(fixedOreResourceRoot, "assets/${fixedOreModId}/lang")
            langDir.mkdirs()
            def sourceEn = file("src/main/resources/assets/${fixedOreModId}/lang/en_us.json")
            def sourceZh = file("src/main/resources/assets/${fixedOreModId}/lang/zh_cn.json")
            def en = sourceEn.exists() ? new groovy.json.JsonSlurper().parse(sourceEn) : [:]
            def zh = sourceZh.exists() ? new groovy.json.JsonSlurper().parse(sourceZh) : [:]

            materials.each { material ->
                def recipeName = material.source.split(':')[1].replaceFirst('^ore/', '')
                def recipePath = "data/tfc/recipe/heating/ore/${recipeName}.json"
                def entry = zip.getEntry(recipePath)
                if (entry == null) {
                    if (material.required) {
                        throw new IllegalStateException("TFC 缺少必需矿物加热配方: ${recipePath}")
                    }
                    task.logger.lifecycle("跳过可选矿物 ${material.id}: TFC 未提供 ${recipePath}")
                    return
                }
                def recipe = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
                def result = recipe.result_fluid
                if (result.id != material.fluid || result.amount != material.amount ||
                    Math.abs((result.temperature ?: recipe.temperature) as BigDecimal - material.temperature as BigDecimal) > 0.01) {
                    throw new IllegalStateException("矿物清单与 TFC 配方不一致: ${material.id} (${recipePath})")
                }
                def itemDir = new File(fixedOreResourceRoot, "assets/${fixedOreModId}/models/item")
                itemDir.mkdirs()
                [
                    "rocky_crushed_${material.id}_ore": "rocky_crushed_${material.id}_ore",
                    "crushed_${material.id}_ore": "crushed_${material.id}_ore",
                    "${material.id}_ore_powder": "${material.id}_ore_powder",
                    "${material.id}_ore_pellet_25mb": "${material.id}_ore_pellet_25mb",
                    "${material.id}_ore_pellet_100mb": "${material.id}_ore_pellet_100mb"
                ].each { itemId, texture ->
                    def generatedModel = new File(itemDir, "${itemId}.json")
                    def sourceModel = file("src/main/resources/assets/${fixedOreModId}/models/item/${itemId}.json")
                    if (!sourceModel.exists()) {
                        // 优先复用参考模组同类物品模型，仅重写纹理命名空间和本模组的文件名。
                        def referenceName = itemId.startsWith('rocky_crushed_')
                            ? "rocky_chunks_${material.id}.json"
                            : itemId.startsWith('crushed_')
                                ? "chunks_${material.id}.json"
                                : itemId.endsWith('_powder')
                                    ? "dirty_dust_${material.id}.json"
                                    : itemId.endsWith('_25mb')
                                        ? "pellet_${material.id}.json"
                                        : "briquet_${material.id}.json"
                        def referenceEntry = referenceJar.exists()
                            ? readReferenceModel(referenceJar, "assets/tfcorewashing/models/item/${referenceName}", texture)
                            : null
                        generatedModel.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                            referenceEntry ?: [parent: 'minecraft:item/generated', textures: [layer0: "${fixedOreModId}:item/${texture}"]]
                        ))
                    }
                }
                en["item.${fixedOreModId}.rocky_crushed_${material.id}_ore"] = "Rocky Crushed ${material.id.capitalize()} Ore"
                en["item.${fixedOreModId}.crushed_${material.id}_ore"] = "Crushed ${material.id.capitalize()} Ore"
                en["item.${fixedOreModId}.${material.id}_ore_powder"] = "${material.id.capitalize()} Ore Powder"
                en["item.${fixedOreModId}.${material.id}_ore_pellet_25mb"] = "${material.id.capitalize()} Ore Pellet (25 mB)"
                en["item.${fixedOreModId}.${material.id}_ore_pellet_100mb"] = "${material.id.capitalize()} Ore Briquet (100 mB)"
                def chineseName = fixedOreChineseNames[material.id] ?: material.id
                zh["item.${fixedOreModId}.rocky_crushed_${material.id}_ore"] = "带岩粗碎${chineseName}矿"
                zh["item.${fixedOreModId}.crushed_${material.id}_ore"] = "碎${chineseName}矿"
                zh["item.${fixedOreModId}.${material.id}_ore_powder"] = "${chineseName}矿粉"
                zh["item.${fixedOreModId}.${material.id}_ore_pellet_25mb"] = "${chineseName}矿团（25 mB）"
                zh["item.${fixedOreModId}.${material.id}_ore_pellet_100mb"] = "${chineseName}矿团（100 mB）"
                // TFC 原生洗矿槽通过 Deposit 数据识别输入，并执行其引用的战利品表。
                def depositDir = new File(fixedOreResourceRoot, "data/${fixedOreModId}/tfc/deposit")
                def depositLootDir = new File(fixedOreResourceRoot, "data/${fixedOreModId}/loot_table/deposit")
                depositDir.mkdirs()
                depositLootDir.mkdirs()
                def crushedOre = "${fixedOreModId}:crushed_${material.id}_ore"
                def powderItem = "${fixedOreModId}:${material.id}_ore_powder"
                def depositId = "${fixedOreModId}:deposit/${material.id}"
                new File(depositDir, "${material.id}.json").text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson([
                        ingredient: [item: crushedOre],
                        loot_table: depositId
                    ])
                )

                // 1 份 5 mB 碎矿固定给出 1 份 5 mB 矿粉，再独立判定 1 次 50% 额外产出（实现 1.5x 洗矿增产收益），并附带母岩石子等副产物判定。
                def powderEntry = { Map extra = [:] ->
                    [type: 'minecraft:item', name: powderItem] + extra
                }
                def depositLoot = [
                    type: 'minecraft:empty',
                    pools: [
                        [
                            name: 'base_powder',
                            rolls: 1,
                            entries: [powderEntry(functions: [[
                                function: 'minecraft:set_count',
                                count: 1
                            ]])]
                        ],
                        [
                            name: 'bonus_powder',
                            rolls: 1,
                            entries: [powderEntry(conditions: [[
                                condition: 'minecraft:random_chance',
                                chance: 0.5
                            ]])]
                        ],
                        [
                            name: 'byproducts',
                            rolls: 1,
                            entries: [
                                [
                                    type: 'minecraft:item',
                                    name: 'tfc:rock/loose/granite',
                                    conditions: [[
                                        condition: 'minecraft:random_chance',
                                        chance: 0.20
                                    ]]
                                ]
                            ]
                        ]
                    ]
                ]
                new File(depositLootDir, "${material.id}.json").text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(depositLoot)
                )

                // 4合1 随身无序合成：4 矿粉 -> 1 小矿团(25mB 提纯)，4 小矿团 -> 1 大矿团(100mB)
                def recipeDir = new File(fixedOreResourceRoot, "data/${fixedOreModId}/recipe")
                recipeDir.mkdirs()
                def powder = "${fixedOreModId}:${material.id}_ore_powder"
                def pellet25 = "${fixedOreModId}:${material.id}_ore_pellet_25mb"
                def pellet100 = "${fixedOreModId}:${material.id}_ore_pellet_100mb"
                def shapeless = { List<String> ingredients, String outputId, int count ->
                    [type: 'minecraft:crafting_shapeless', ingredients: ingredients.collect { [item: it] },
                     result: [id: outputId, count: count]]
                }
                def recipes = [
                    ("${material.id}_ore_pellet_25mb.json"): shapeless((1..4).collect { powder }, pellet25, 1),
                    ("${material.id}_ore_pellet_25mb_unpacking.json"): shapeless([pellet25], powder, 4),
                    ("${material.id}_ore_pellet_100mb.json"): shapeless((1..4).collect { pellet25 }, pellet100, 1),
                    ("${material.id}_ore_pellet_100mb_unpacking.json"): shapeless([pellet100], pellet25, 4)
                ]
                recipes.each { fileName, recipeData ->
                    def target = new File(recipeDir, fileName)
                    def sourceRecipe = file("src/main/resources/data/${fixedOreModId}/recipe/${fileName}")
                    if (!sourceRecipe.exists()) {
                        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipeData))
                    }
                }

                // 4 档品位（small 2, poor 3, normal 5, rich 7）锤碎与机械加工配置（对应 10/15/25/35 mB 金属）
                def oreBaseName = material.source.split(':')[1].replaceFirst('^ore/normal_', '')
                def grades = [
                    small: [source: "tfc:ore/small_${oreBaseName}", count: 2],
                    poor: [source: "tfc:ore/poor_${oreBaseName}", count: 3],
                    normal: [source: "tfc:ore/normal_${oreBaseName}", count: 5],
                    rich: [source: "tfc:ore/rich_${oreBaseName}", count: 7]
                ]

                def crushingDir = new File(recipeDir, 'crushing')
                crushingDir.mkdirs()
                def quernDir = new File(recipeDir, 'quern')
                quernDir.mkdirs()
                def createCompatDir = new File(recipeDir, 'compat/create')
                createCompatDir.mkdirs()
                def ieCompatDir = new File(recipeDir, 'compat/immersiveengineering')
                ieCompatDir.mkdirs()

                grades.each { gradeName, gradeData ->
                    // 1. 手工锤碎（全模式通用：按品位输出 2/3/5/7 份碎矿）
                    def crushingRecipe = [
                        type: "${fixedOreModId}:ore_crushing",
                        ingredient: [item: gradeData.source],
                        result: [id: crushedOre, count: gradeData.count]
                    ]
                    new File(crushingDir, "${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(crushingRecipe)
                    )

                    // 2. Create 动力压板单次冲压破碎（只要压一下即可按品位破碎为碎矿）
                    def pressingRecipe = [
                        'neoforge:conditions': [
                            [type: 'neoforge:mod_loaded', mod_id: 'create']
                        ],
                        type: 'create:pressing',
                        ingredients: [[item: gradeData.source]],
                        results: [
                            [item: crushedOre, count: gradeData.count]
                        ]
                    ]
                    new File(createCompatDir, "pressing_${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(pressingRecipe)
                    )

                    // 3. TFC 手推磨 Quern 研磨（经典扩展模式）
                    def quernRecipe = [
                        'neoforge:conditions': [
                            [type: "${fixedOreModId}:pipeline_mode", mode: 'template_classic']
                        ],
                        type: 'tfc:quern',
                        ingredient: [item: gradeData.source],
                        result: [item: crushedOre, count: gradeData.count]
                    ]
                    new File(quernDir, "${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(quernRecipe)
                    )

                    // 4. Create 石磨 Milling（经典扩展模式）
                    def millingRecipe = [
                        'neoforge:conditions': [
                            [type: 'neoforge:mod_loaded', mod_id: 'create'],
                            [type: "${fixedOreModId}:pipeline_mode", mode: 'template_classic']
                        ],
                        type: 'create:milling',
                        ingredients: [[item: gradeData.source]],
                        results: [
                            [item: crushedOre, count: gradeData.count],
                            [item: powderItem, chance: 0.5]
                        ],
                        processingTime: 100
                    ]
                    new File(createCompatDir, "milling_${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(millingRecipe)
                    )

                    // 5. Create 粉碎轮 Crushing（经典扩展模式）
                    def createCrushingRecipe = [
                        'neoforge:conditions': [
                            [type: 'neoforge:mod_loaded', mod_id: 'create'],
                            [type: "${fixedOreModId}:pipeline_mode", mode: 'template_classic']
                        ],
                        type: 'create:crushing',
                        ingredients: [[item: gradeData.source]],
                        results: [
                            [item: crushedOre, count: gradeData.count],
                            [item: powderItem, count: 2, chance: 0.5]
                        ],
                        processingTime: 150
                    ]
                    new File(createCompatDir, "crushing_${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(createCrushingRecipe)
                    )

                    // 6. IE 品位细分 Crusher
                    def ieGradedCrusher = [
                        'neoforge:conditions': [
                            [type: 'neoforge:mod_loaded', mod_id: 'immersiveengineering']
                        ],
                        type: 'immersiveengineering:crusher',
                        energy: 1600,
                        input: [item: gradeData.source],
                        result: [item: crushedOre, count: gradeData.count],
                        secondaries: [
                            [chance: 0.20, output: [item: powderItem]]
                        ]
                    ]
                    new File(ieCompatDir, "crusher_${material.id}_${gradeName}.json").text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(ieGradedCrusher)
                    )
                }

                // 新版为每种矿物注册独立物品 ID，因此中间产物都需要自己的 TFC 加热配方（带岩粗碎矿 5mB、碎矿 5mB、矿粉 5mB、小矿团 25mB、大矿团 100mB）。
                def rockyCrushedOre = "${fixedOreModId}:rocky_crushed_${material.id}_ore"
                def heatingDir = new File(recipeDir, 'heating')
                heatingDir.mkdirs()
                def heatingRecipe = { String inputItem, int outputAmount ->
                    [
                        type: 'tfc:heating',
                        ingredient: [item: inputItem],
                        result_fluid: [id: material.fluid, amount: outputAmount],
                        temperature: material.temperature
                    ]
                }
                [
                    ("rocky_crushed_${material.id}_ore.json"): heatingRecipe(rockyCrushedOre, 5),
                    ("crushed_${material.id}_ore.json"): heatingRecipe(crushedOre, 5),
                    ("${material.id}_ore_powder.json"): heatingRecipe(powder, 5),
                    ("${material.id}_ore_pellet_25mb.json"): heatingRecipe(pellet25, 25),
                    ("${material.id}_ore_pellet_100mb.json"): heatingRecipe(pellet100, 100)
                ].each { fileName, recipeData ->
                    new File(heatingDir, fileName).text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(recipeData)
                    )
                }
            }

            // 通用物品语言补全
            en["item.${fixedOreModId}.rocky_crushed_ore"] = "Rocky Crushed Ore"
            en["item.${fixedOreModId}.crushed_ore"] = "Crushed Ore"
            en["item.${fixedOreModId}.ore_powder"] = "Ore Powder"
            en["item.${fixedOreModId}.ore_pellet_25mb"] = "Ore Pellet (25 mB)"
            en["item.${fixedOreModId}.ore_pellet_100mb"] = "Ore Briquet (100 mB)"

            zh["item.${fixedOreModId}.rocky_crushed_ore"] = "带岩粗碎矿"
            zh["item.${fixedOreModId}.crushed_ore"] = "碎矿"
            zh["item.${fixedOreModId}.ore_powder"] = "矿粉"
            zh["item.${fixedOreModId}.ore_pellet_25mb"] = "矿团（25 mB）"
            zh["item.${fixedOreModId}.ore_pellet_100mb"] = "矿团（100 mB）"

            // 生成通用物品的动态 TFC 加热配方，用于承载额外添加矿石在 TFC 坩埚中的熔化
            def recipeDir = new File(fixedOreResourceRoot, "data/${fixedOreModId}/recipe")
            def heatingDir = new File(recipeDir, 'heating')
            heatingDir.mkdirs()
            def dynamicHeatingRecipe = { String itemId, int amount ->
                [
                    type: "${fixedOreModId}:dynamic_heating",
                    ingredient: [item: "${fixedOreModId}:${itemId}"],
                    amount: amount,
                    temperature: 1080.0
                ]
            }
            [
                'dynamic_rocky_crushed_ore.json': dynamicHeatingRecipe('rocky_crushed_ore', 5),
                'dynamic_crushed_ore.json': dynamicHeatingRecipe('crushed_ore', 5),
                'dynamic_ore_powder.json': dynamicHeatingRecipe('ore_powder', 5),
                'dynamic_ore_pellet_25mb.json': dynamicHeatingRecipe('ore_pellet_25mb', 25),
                'dynamic_ore_pellet_100mb.json': dynamicHeatingRecipe('ore_pellet_100mb', 100)
            ].each { fileName, recipeData ->
                new File(heatingDir, fileName).text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(recipeData)
                )
            }
            // 所有矿物合并完成后只写一次，保留完整语言表。
            new File(langDir, 'en_us.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(en))
            new File(langDir, 'zh_cn.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(zh))
        } finally {
            zip.close()
        }
    }
}
sourceSets.main.resources.srcDir generateFixedOreResources
tasks.named('processResources') {
    dependsOn generateFixedOreResources
    exclude "assets/${fixedOreModId}/lang/en_us.json"
    exclude "assets/${fixedOreModId}/lang/zh_cn.json"
    doLast {
        // 源语言文件被排除后，显式把完整合并结果放入最终资源包。
        copy {
            from fixedOreResourceRoot
            into destinationDir
            include "assets/${fixedOreModId}/lang/en_us.json"
            include "assets/${fixedOreModId}/lang/zh_cn.json"
        }
    }
}
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
